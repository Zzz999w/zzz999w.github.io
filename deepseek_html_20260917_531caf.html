<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词语 · 解释 · 侧重 连线</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;padding:18px;
    display:flex;align-items:flex-start;justify-content:center;
    background:linear-gradient(135deg,#eef3ff 0%,#f7f0ff 50%,#eafaf5 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#2a3350;
  }
  .app{width:min(1060px,100%);background:#fff;border-radius:22px;
       box-shadow:0 24px 60px rgba(70,90,150,.16);padding:24px 24px 20px;}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:.5px;}
  .sub{font-size:13px;color:#8a94b0;margin:0 0 16px;line-height:1.6;}

  button{
    border:none;background:linear-gradient(135deg,#5b8bff,#7a6bff);color:#fff;
    padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
    font-family:inherit;cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 16px rgba(90,120,255,.3);
    transition:transform .15s,box-shadow .15s;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(90,120,255,.4);}
  button:active{transform:translateY(0) scale(.98);}
  button.ghost{
    background:#f2f5fd;color:#4a5578;box-shadow:none;border:1.5px solid #dde5f7;
  }
  button.ghost:hover{background:#e9f0ff;box-shadow:none;}
  button.hint-btn{
    background:linear-gradient(135deg,#ffb340,#ff8a3d);
    box-shadow:0 6px 16px rgba(255,150,60,.35);
  }
  button.hint-btn:hover{box-shadow:0 9px 22px rgba(255,150,60,.45);}

  /* ============ 首页 ============ */
  .group-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
    gap:12px;max-height:70vh;overflow-y:auto;padding:4px 6px 4px 2px;
  }
  .group-card{
    background:#f9fbff;border:2px solid #dde5f7;border-radius:14px;
    padding:13px 14px;cursor:pointer;user-select:none;
    transition:border-color .16s,transform .16s,box-shadow .16s,background .16s;
  }
  .group-card:hover{border-color:#8fb0ff;transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(90,120,255,.14);}
  .group-card .no{font-size:15px;font-weight:700;color:#2c3a63;display:flex;
    align-items:center;justify-content:space-between;gap:8px;}
  .group-card .words{font-size:11.5px;color:#7a86a8;margin-top:7px;line-height:1.7;}
  .badge{font-size:11px;font-weight:600;color:#1a8f62;background:#e2f7ed;
    border-radius:20px;padding:2px 9px;}
  .group-card.done{border-color:#34c98a;background:#eafaf3;}

  /* ============ 游戏页 ============ */
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .topbar .title{font-size:15px;font-weight:700;color:#2c3a63;}
  .topbar .stat{font-size:13px;font-weight:600;color:#4a5578;}
  .topbar .hint{font-size:12.5px;color:#6b7ba8;flex:1;min-width:110px;}
  .spacer{flex:1;}

  .board{
    position:relative;display:flex;gap:10px;
    height:clamp(420px,62vh,600px);
  }
  .lines{position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:1;overflow:visible;}
  .col{display:flex;flex-direction:column;gap:7px;position:relative;z-index:2;min-width:0;}
  .col.c0{flex:0 0 20%;}
  .col.c1{flex:1 1 41%;}
  .col.c2{flex:1 1 39%;}

  .card{
    flex:1 1 0;min-height:42px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:6px 9px;border-radius:11px;
    border:2px solid #dde5f7;background:#f9fbff;
    font-size:12.5px;line-height:1.4;color:#35405f;
    cursor:pointer;user-select:none;overflow:auto;
    transition:border-color .16s,background .16s,transform .16s,
               box-shadow .16s,color .16s;
  }
  .card::-webkit-scrollbar{width:0;height:0;}
  .col.c0 .card{font-size:15px;font-weight:700;letter-spacing:.5px;color:#2c3a63;}
  .card:hover{border-color:#8fb0ff;transform:translateY(-1px);}
  .card.selected{border-color:#4a7dff;background:#e9f0ff;
    box-shadow:0 0 0 4px rgba(74,125,255,.15);}
  .card.done{border-color:#34c98a;background:#eafaf3;color:#1a8f62;
    cursor:default;transform:none;box-shadow:none;}
  .card.done:hover{transform:none;border-color:#34c98a;}
  .card.wrong{border-color:#ff5a5a;background:#ffecec;animation:shake .4s;}

  .card.reveal{
    border-color:#ffb340;
    background:#fff8ec;
    box-shadow:0 0 0 5px rgba(255,179,64,.25);
    animation:revealPulse .7s ease 3;
  }
  @keyframes revealPulse{
    0%,100%{box-shadow:0 0 0 3px rgba(255,179,64,.18);}
    50%    {box-shadow:0 0 0 9px rgba(255,179,64,.42);}
  }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .flash{animation:flash .7s forwards;}
  @keyframes flash{
    0%{opacity:0;}15%{opacity:1;}70%{opacity:1;}100%{opacity:0;}
  }

  .msg{
    margin-top:14px;text-align:center;font-size:15px;color:#1a8f62;
    background:#eafaf3;border-radius:12px;max-height:0;padding:0 16px;
    overflow:hidden;opacity:0;transition:all .35s ease;
  }
  .msg.show{max-height:120px;padding:14px 16px;opacity:1;}
  .msg button{margin-top:10px;}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(44,58,99,.94);color:#fff;font-size:13.5px;
    padding:11px 20px;border-radius:12px;z-index:99;
    opacity:0;pointer-events:none;transition:all .3s ease;
    box-shadow:0 10px 28px rgba(30,40,80,.28);max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hidden{display:none !important;}

  @media (max-width:680px){
    .app{padding:15px 12px;border-radius:18px;}
    h1{font-size:18px;}
    .group-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:66vh;}
    .board{height:clamp(400px,64vh,560px);gap:6px;}
    .col{gap:5px;}
    .col.c0{flex:0 0 22%;}
    .card{font-size:10.5px;padding:5px 5px;border-radius:8px;border-width:1.5px;
      line-height:1.3;min-height:36px;}
    .col.c0 .card{font-size:12.5px;}
    .topbar .hint{display:none;}
    button{padding:8px 12px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 首页 ============ -->
  <div id="homeView">
    <h1>词语 · 解释 · 侧重 连线</h1>
    <p class="sub">共 <b id="totalCount">0</b> 个词语，已分成 <b id="groupCount">0</b> 组，每组 10 个。点开一组即可开始连线。</p>
    <div class="group-grid" id="groupGrid"></div>
  </div>

  <!-- ============ 游戏页 ============ -->
  <div id="gameView" class="hidden">
    <div class="topbar">
      <button class="ghost" id="backBtn">← 返回分组</button>
      <span class="title" id="groupTitle"></span>
      <span class="stat" id="stat"></span>
      <span class="hint" id="hint"></span>
      <span class="spacer"></span>
      <button class="hint-btn" id="hintBtn">💡 提示</button>
      <button id="replayBtn">重玩本组</button>
    </div>

    <div class="board" id="board">
      <svg class="lines" id="lines"></svg>
      <div class="col c0" id="col0"></div>
      <div class="col c1" id="col1"></div>
      <div class="col c2" id="col2"></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   数据：词语|解释|侧重  （来自表格，已去重；表述略有精简）
   ========================================================== */
const RAW = `
笃定|内心确信、不犹豫|主观信念坚定，偏内心状态
确定|明确界定、无歧义|客观事实清晰，偏客观界定
淡定|情绪平和、不慌乱|日常压力下的从容，语境较轻松
镇定|危机中保持理性|紧急局面克制紧张，语境具紧迫性
磨难|严重且持久的苦难|苦难强度大、持续久
波折|过程中出现的阻碍起伏|事务推进有曲折，语境较温和
磨炼|目标受阻、遭遇失利|单次明确的失败，针对性强
挫折|通过困难锻炼提升|困难转化为成长动力
浩如烟海|形容文献、资料、书籍数量极多|多而广，描述文献资料的庞大体量
纷繁芜杂|形容事物多而杂乱，没有条理|数量多且混乱无序
汗牛充栋|形容藏书极多|多而堆，具体实物的堆积情况
鳞次栉比|形容建筑物、船只等密集整齐|排列的密集与整齐

如火如荼|比喻气势旺盛、热烈或激烈|规模大、气势盛、氛围热烈
如日中天|比喻事物发展到最兴盛、最强大的阶段|发展状态的鼎盛
凤毛麟角|比喻珍贵而稀少的人或事物|稀有且珍贵，数量极少且价值高

宽泛|指范围广、不狭窄，界限不明确|范围的广度和模糊性
广阔|指面积、空间等广大宽阔|地域或空间的辽阔
广泛|指涉及的面广、范围大|范围的全面和普及
不一而足|同类事物很多|隐含列举了部分，同类还有很多
不胜枚举|数量极多，无法列举|试图列举但数量太多而失败
比比皆是|到处都是，形容极其常见|分布的广泛性和普遍常见性
数不胜数|数量极多，数也数不过来|可用于任何数量极多的场景
发展空间|指事物未来发展的余地、潜力|未来的可能性和拓展性
先天优势|指天生具备的、与生俱来的有利条件|与生俱来的优越性
战略储备|指为应对战争、危机而预先储备的物资|出于长远战略考虑的储备行为

吉光片羽|比喻残存的珍贵文物或零星片段|残存性与珍贵性

言之成理|说话写文章讲得通顺、合乎逻辑|逻辑的合理性，强调论证严谨
不绝如缕|局势危急或事物后继乏人、即将中断|似断非断的临界感
生机勃勃|形容充满生命力，活力旺盛|处于蓬勃发展的状态
势不可挡|来势猛烈，难以遏制|趋势的强大与不可抗拒
源远流长|比喻历史悠久，根基深厚|存在的时间长、起源早
美轮美奂|形容房屋高大华丽，也指装饰场景|视觉的壮观与精致
薪火相传|学问、技艺、精神等代代传承|传承的延续性
一脉相承|思想、文化、学说等前后相承|传承同一源头与持续延续
彪炳千古|形容伟大的事迹流传千秋万代|成就的辉煌性与影响的持久性
峰回路转|经历挫折后出现新的转机或局面|转折的突发性，不必然向好
柳暗花明|困境中突然出现转机，看到希望|困境中见希望，明确指向向好
苦尽甘来|艰难的日子过去，美好的日子到来|先苦后甜的结果
出奇制胜|用对方意想不到的方法取得胜利|策略的意外性与有效性
无出其右|无人能超过，在某方面居首位|程度最高、绝对领先
独树一帜|风格、观点、方法等自成一家|独特性、创新性，个性鲜明

盛极一时|在一个时期内特别兴盛|达到顶峰
融会贯通|把各方面知识融合，全面透彻理解|将分散转为系统并灵活运用
蔚然成风|事物逐渐发展、盛行，形成风气|普遍性、群体性
此消彼长|双方力量、数量交替增减变化|动态平衡、相互影响
深入人心|思想、理论被群众理解并拥护|深度认同、持久性
如数家珍|像数家里珍宝般熟悉事物|熟悉程度高、了如指掌
驾轻就熟|做熟悉的事轻松熟练|做事熟练、轻松无压力
望其项背|能赶上对方|可追赶、非远超状态
游刃有余|处理事情熟练且有余地|应对从容、无局促感
并驾齐驱|并排前进不分先后|双方实力相当、同步向前
熟能生巧|熟练后掌握技巧更顺手|熟练出技巧、效率提升
势均力敌|双方力量相当不分高下|力量对等、难分胜负
严丝合缝|缝隙严密无空隙|衔接紧密、无疏漏之处
锱铢必较|对极细微利益或小事都过分计较|过分计较细微之处、不肯吃亏
未雨绸缪|提前准备，防患尚未发生的问题|事前筹备、防患于未然
谨小慎微|对细小事情过分谨慎|处事谨慎、畏葸不前
防微杜渐|在问题萌芽时及时制止|早控萌芽问题、避免恶化

完善|使事物完备无缺|使完备、补全缺陷

保护|采取措施守护事物|守护防御、免受伤害

改善|使状况、条件变得更好|状态优化、变得更好

听之任之|任凭坏事发展，不干预|消极放任、该管不管
发挥|把潜在能力、作用展现出来|能力实际展现、释放效用

技高一筹|技艺能力比他人高出一些|技艺能力更高、略胜一筹

更胜一筹|比另一方水平、效果稍好|水平效果更优、略占上风

回忆|过往经历的留存|记忆留存、回想过往

贯通|前后连接打通|破除阻隔、逻辑或空间连通
锤炼|反复打磨使完善|反复打磨、精益求精

休戚与共|祸福相互关联、共同承担|命运与共、祸福相依
惊人|程度效果超出预期|超乎寻常、令人惊讶
赞誉|称赞颂扬|表扬
心悦诚服|内心真心信服|真诚认同
青睐|喜爱或重视|偏爱、看好
虽败犹荣|失败仍有荣耀|失败有价值
欢迎|高兴迎接|接纳
保障|采取措施确保需求实现|安全保障性
徒劳无功|付出努力却没收获成果|行动毫无成效
本末倒置|颠倒主要与次要的关系|主次位置错位
控制|对事物进行约束管理|主导调控性
黯然失色|因对比失去原有光彩|色彩、吸引力丧失
相形见绌|对比后显得远远不如|比较后的差距感
自惭形秽|因不如人而感到惭愧|内心的羞愧感
比上不足|和强者比有差距|与上位者的差距
遥遥领先|远超他人处于前列|位置的领先
删繁就简|去除繁杂保留简洁|内容的精简
迎难而上|面对困难主动前进|态度的主动
惜墨如金|写作时慎重使用笔墨|用笔的审慎
与众不同|和他人存在明显差异|特征的独特
言简意赅|语言简练而含义完备|表达的精炼
字斟句酌|逐字逐句反复推敲|措辞的严谨
复杂|结构或关系多而杂|内在的繁复性
漫长|时间或过程持续久|时长的持久性
简易|流程简单易操作|实施的简便性
短暂|持续时间短|时长的短促性
简短|长度或内容短且简洁|形式的短小性
迅速|动作或变化发生快|速度的快捷性
繁杂|种类或头绪多而乱|状态的纷乱性
冗长|时间或内容多余过长|状态的冗余性
推崇备至|极其推重敬佩|态度的尊崇性
身体力行|亲身体验并努力践行|行动的实践性
全力以赴|投入全部力量去做|付出的彻底性
孜孜以求|勤勉不懈地追求目标|过程的持续性
束手就擒|放弃抵抗任由抓捕|无反抗性
一探究竟|深入探寻事物真相|主动探寻性
坐以待毙|坐着等待死亡|不主动、消极
见机行事|根据局势灵活行动|应对的灵活性
自投罗网|主动陷入圈套|行为盲目、主动
自取灭亡|自身行为导致毁灭|结果的自致性
静观其变|冷静观察局势变化|不急于行动、观望
`.trim();

const DATA = RAW.split('\n').map(line => {
  const p = line.split('|');
  return { w:(p[0]||'').trim(), m:(p[1]||'').trim(), s:(p[2]||'').trim() };
}).filter(q => q.w && q.m && q.s);

/* ---------- 分组：每 10 个一组 ---------- */
const PER_GROUP = 10;
const GROUPS = [];
for (let i = 0; i < DATA.length; i += PER_GROUP) {
  GROUPS.push(DATA.slice(i, i + PER_GROUP));
}
if (GROUPS.length > 1 && GROUPS[GROUPS.length - 1].length < 6) {
  const tail = GROUPS.pop();
  GROUPS[GROUPS.length - 1] = GROUPS[GROUPS.length - 1].concat(tail);
}

/* ---------- DOM ---------- */
const homeView   = document.getElementById('homeView');
const gameView   = document.getElementById('gameView');
const groupGrid  = document.getElementById('groupGrid');
const groupTitle = document.getElementById('groupTitle');
const statEl     = document.getElementById('stat');
const hintEl     = document.getElementById('hint');
const msgEl      = document.getElementById('msg');
const board      = document.getElementById('board');
const svg        = document.getElementById('lines');
const colEls     = [0,1,2].map(i => document.getElementById('col' + i));
const backBtn    = document.getElementById('backBtn');
const replayBtn  = document.getElementById('replayBtn');
const hintBtn    = document.getElementById('hintBtn');
const toastEl    = document.getElementById('toast');

const NS = 'http://www.w3.org/2000/svg';
const doneGroups = new Set();

/* ---------- 游戏状态 ---------- */
let curGroup = -1;
let sel      = [null, null, null];
let links    = [];
let solved   = 0;
let total    = 0;
let errors   = 0;
let finished = false;
let startTime = 0;
let revealTimers = [];

/* ==========================================================
   首页
   ========================================================== */
function renderHome() {
  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('groupCount').textContent = GROUPS.length;

  groupGrid.innerHTML = '';
  GROUPS.forEach((g, i) => {
    const card = document.createElement('div');
    card.className = 'group-card' + (doneGroups.has(i) ? ' done' : '');

    const no = document.createElement('div');
    no.className = 'no';
    no.innerHTML = `<span>第 ${i + 1} 组</span>` +
      (doneGroups.has(i) ? '<span class="badge">已通关</span>'
                         : `<span class="badge" style="color:#6b7ba8;background:#eef2fc">${g.length} 词</span>`);

    const words = document.createElement('div');
    words.className = 'words';
    const preview = g.slice(0, 5).map(q => q.w).join(' · ');
    words.textContent = preview + (g.length > 5 ? ' 等' : '');

    card.appendChild(no);
    card.appendChild(words);
    card.addEventListener('click', () => startGame(i));
    groupGrid.appendChild(card);
  });

  homeView.classList.remove('hidden');
  gameView.classList.add('hidden');
}

/* ==========================================================
   开始一组  —— 三列各自独立随机打乱
   ========================================================== */
function startGame(gi) {
  curGroup = gi;
  const items = GROUPS[gi].map((q, i) => ({ ...q, id: i }));
  total = items.length;

  sel = [null, null, null];
  links = [];
  solved = 0;
  errors = 0;
  finished = false;
  clearRevealTimers();

  svg.innerHTML = '';
  colEls.forEach(c => c.innerHTML = '');
  msgEl.classList.remove('show');
  msgEl.innerHTML = '';

  /* ✅ 关键：词语、解释、侧重 分别独立洗牌，每次进入顺序都不同 */
  const words    = shuffleArr(items);
  const meanings = shuffleArr(items);
  const stresses = shuffleArr(items);

  words.forEach(q    => colEls[0].appendChild(makeCard(q.id, 0, q.w)));
  meanings.forEach(q => colEls[1].appendChild(makeCard(q.id, 1, q.m)));
  stresses.forEach(q => colEls[2].appendChild(makeCard(q.id, 2, q.s)));

  groupTitle.textContent = `第 ${gi + 1} 组`;
  homeView.classList.add('hidden');
  gameView.classList.remove('hidden');

  startTime = Date.now();
  updateBar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function makeCard(id, col, text) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = id;
  el.dataset.col = col;
  el.textContent = text;
  el.addEventListener('click', () => onCard(el));
  return el;
}

/* Fisher–Yates 洗牌，返回新数组（不改变原数组） */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ==========================================================
   点击卡片
   ========================================================== */
function onCard(el) {
  if (finished || el.classList.contains('done')) return;

  const c = Number(el.dataset.col);

  if (sel[c] === el) {
    el.classList.remove('selected');
    sel[c] = null;
    updateBar();
    return;
  }

  if (sel[c]) sel[c].classList.remove('selected');
  sel[c] = el;
  el.classList.add('selected');

  for (let i = c + 1; i < 3; i++) {
    if (sel[i]) { sel[i].classList.remove('selected'); sel[i] = null; }
  }

  updateBar();

  if (sel[0] && sel[1] && sel[2]) judge();
}

/* ==========================================================
   判定
   ========================================================== */
function judge() {
  const [a, b, c] = sel;
  const ok = a.dataset.id === b.dataset.id && b.dataset.id === c.dataset.id;

  if (ok) {
    [a, b, c].forEach(el => {
      el.classList.remove('selected');
      el.classList.add('done');
    });
    sel = [null, null, null];

    solved++;
    links.push({ a, b }, { b, c });
    drawLink(a, b, true, true);
    drawLink(b, c, true, true);

    updateBar();
    if (solved === total) finishGame();
  } else {
    errors++;
    const wrong = sel.slice();
    const wordId = wrong[0].dataset.id;
    sel = [null, null, null];

    wrong.forEach(el => {
      el.classList.remove('selected');
      el.classList.add('wrong');
      setTimeout(() => el.classList.remove('wrong'), 520);
    });

    const l1 = drawLink(wrong[0], wrong[1], false, false);
    const l2 = drawLink(wrong[1], wrong[2], false, false);
    [l1, l2].forEach(l => {
      l.classList.add('flash');
      setTimeout(() => l.remove(), 720);
    });

    showToast('连错了～ 金色闪烁的就是正确答案');
    revealTimers.push(setTimeout(() => revealCorrect(wordId, 3), 560));

    updateBar();
  }
}

/* ==========================================================
   正确答案高亮
   ========================================================== */
function revealCorrect(id, times = 3) {
  const nodes = [];
  [0,1,2].forEach(c => {
    const card = colEls[c].querySelector(`.card[data-id="${id}"]`);
    if (card && !card.classList.contains('done')) nodes.push(card);
  });
  if (!nodes.length) return;

  nodes.forEach(card => {
    card.classList.remove('reveal');
    void card.offsetWidth;
    card.style.animationIterationCount = times;
    card.classList.add('reveal');
  });

  revealTimers.push(setTimeout(() => {
    nodes.forEach(card => {
      card.classList.remove('reveal');
      card.style.animationIterationCount = '';
    });
  }, 700 * times + 150));
}

function clearRevealTimers() {
  revealTimers.forEach(t => clearTimeout(t));
  revealTimers = [];
}

/* ==========================================================
   提示按钮
   ========================================================== */
hintBtn.addEventListener('click', () => {
  if (finished) { showToast('本组已经完成啦'); return; }

  const picked = sel.find(s => s !== null);
  if (!picked) {
    showToast('请先点一张卡片，再点「提示」');
    return;
  }
  const id = picked.dataset.id;
  const target = GROUPS[curGroup] ? GROUPS[curGroup][Number(id)] : null;

  revealCorrect(id, 3);
  if (target) {
    showToast(`正确答案：${target.w} —— ${target.m}`);
  }
});

/* ==========================================================
   画线
   ========================================================== */
function drawLink(a, b, ok, animate) {
  const br = board.getBoundingClientRect();
  const ar = a.getBoundingClientRect();
  const cr = b.getBoundingClientRect();

  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', (ar.right - br.left).toFixed(1));
  line.setAttribute('y1', (ar.top + ar.height / 2 - br.top).toFixed(1));
  line.setAttribute('x2', (cr.left - br.left).toFixed(1));
  line.setAttribute('y2', (cr.top + cr.height / 2 - br.top).toFixed(1));
  line.setAttribute('stroke', ok ? '#34c98a' : '#ff5a5a');
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-linecap', 'round');

  if (animate && ok) {
    line.style.strokeDasharray = '600';
    line.style.strokeDashoffset = '600';
    line.style.animation = 'draw .4s ease forwards';
  }

  svg.appendChild(line);
  return line;
}

/* ==========================================================
   状态栏 & 提示条
   ========================================================== */
function updateBar() {
  statEl.textContent = `已连对 ${solved} / ${total}　·　错误 ${errors} 次`;

  if (finished) { hintEl.textContent = ''; return; }
  if (!sel[0])      hintEl.textContent = '① 先点左侧「词语」';
  else if (!sel[1]) hintEl.textContent = '② 再点中间「解释」';
  else if (!sel[2]) hintEl.textContent = '③ 最后点右侧「侧重」';
  else              hintEl.textContent = '';
}

let toastTimer;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ==========================================================
   通关
   ========================================================== */
function finishGame() {
  finished = true;
  doneGroups.add(curGroup);

  const sec = ((Date.now() - startTime) / 1000).toFixed(1);
  msgEl.innerHTML =
    `🎉 本组全部连对！用时 <b>${sec}</b> 秒，错误 <b>${errors}</b> 次<br>` +
    `<button id="nextBtn">下一组 →</button>`;
  msgEl.classList.add('show');

  const nextBtn = document.getElementById('nextBtn');
  if (curGroup + 1 < GROUPS.length) {
    nextBtn.addEventListener('click', () => startGame(curGroup + 1));
  } else {
    nextBtn.textContent = '返回分组';
    nextBtn.addEventListener('click', renderHome);
  }
}

/* ==========================================================
   事件绑定
   ========================================================== */
backBtn.addEventListener('click', renderHome);
replayBtn.addEventListener('click', () => startGame(curGroup));

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    svg.innerHTML = '';
    links.forEach(l => drawLink(l.a, l.b, true, false));
  }, 130);
});

/* 启动 */
renderHome();
</script>
</body>
</html>
